<style id="app-style">/* ===== Paradis du Bien-Être — boutique catalogue ===== */

:root{
  --bg: #fbfcfa;
  --surface: #ffffff;
  --surface-2: #eef4ef;
  --text: #12201a;
  --text-soft: #4d5c53;
  --border: #dde6de;
  --primary: #1f6d40;
  --primary-dark: #124a2a;
  --primary-soft: #e5f2e9;
  --ink: #0d0f0d;
  --danger: #b3432c;
  --shadow: 0 8px 24px -12px rgba(13,26,18,.28);
  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 22px;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #0e1410;
    --surface: #161f19;
    --surface-2: #1c2620;
    --text: #eef5ef;
    --text-soft: #a9bcb0;
    --border: #2a362e;
    --primary: #57c785;
    --primary-dark: #8fe0ab;
    --primary-soft: #1c3527;
    --ink: #eef5ef;
    --danger: #e08a70;
    --shadow: 0 10px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg: #0e1410;
  --surface: #161f19;
  --surface-2: #1c2620;
  --text: #eef5ef;
  --text-soft: #a9bcb0;
  --border: #2a362e;
  --primary: #57c785;
  --primary-dark: #8fe0ab;
  --primary-soft: #1c3527;
  --ink: #eef5ef;
  --danger: #e08a70;
  --shadow: 0 10px 28px -14px rgba(0,0,0,.6);
}

*,*::before,*::after{ box-sizing: border-box; }
html,body{ height:auto; }
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-left: max(16px, env(safe-area-inset-left,0px));
  padding-right: max(16px, env(safe-area-inset-right,0px));
}
img{ max-width:100%; display:block; }
[hidden]{ display:none !important; }
button{ font-family:inherit; }
h1,h2,h3{ font-family:var(--font-display); text-wrap:balance; margin:0; color:var(--ink); }
a{ color:inherit; }
button{ cursor:pointer; }
.visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

.wrap{ max-width:1080px; margin:0 auto; }

/* ---------- Header ---------- */
.site-header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top,0px);
}
.header-row{
  display:flex; align-items:center; gap:12px;
  padding:12px 0;
}
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; margin-right:auto; min-width:0; }
.brand-mark{
  width:38px; height:38px; border-radius:50%; flex:none;
  background:var(--primary); display:flex; align-items:center; justify-content:center;
  color:#fff;
}
.brand-logo{ height:36px; width:auto; max-width:220px; flex:none; object-fit:contain; }
.brand-name{ font-family:var(--font-display); font-weight:600; font-size:1.15rem; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand-tag{ display:block; font-family:var(--font-body); font-size:.68rem; color:var(--text-soft); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.gate-logo{ height:56px; width:auto; max-width:80%; margin:0 auto 14px; object-fit:contain; }

.icon-btn{
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  width:42px; height:42px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface); color:var(--ink);
}
.icon-btn svg{ width:20px; height:20px; }
.cart-count{
  position:absolute; top:-4px; right:-4px; min-width:19px; height:19px; padding:0 4px;
  border-radius:999px; background:var(--primary); color:#fff; font-size:.68rem; font-weight:700;
  display:flex; align-items:center; justify-content:center; border:2px solid var(--bg);
}

.nav-row{ display:flex; gap:18px; padding:0 0 12px; overflow-x:auto; scrollbar-width:none; }
.nav-row::-webkit-scrollbar{ display:none; }
.nav-link{ background:none; border:none; padding:4px 2px; font-weight:700; font-size:.86rem; color:var(--text-soft); white-space:nowrap; border-bottom:2px solid transparent; }
.nav-link.active, .nav-link:hover{ color:var(--primary-dark); border-color:var(--primary); }

/* ---------- Hero ---------- */
.hero{
  margin:18px 0 22px; padding:30px 22px; border-radius:var(--radius-l);
  background:linear-gradient(155deg, var(--primary-soft), var(--surface) 70%);
  border:1px solid var(--border);
  display:flex; flex-direction:column; gap:10px;
}
.hero-eyebrow{ font-size:.72rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--primary-dark); }
.hero h1{ font-size:clamp(1.5rem, 5vw, 2.15rem); font-weight:600; max-width:24ch; }
.hero p{ margin:0; color:var(--text-soft); max-width:46ch; font-size:.96rem; }
.hero-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:999px; border:1px solid transparent;
  font-weight:700; font-size:.88rem; line-height:1; text-decoration:none;
  transition:transform .12s ease;
}
.btn:active{ transform:scale(.97); }
.btn svg{ width:18px; height:18px; flex:none; }
.btn-primary{ background:var(--primary); color:#fff; }
.btn-primary:hover{ background:var(--primary-dark); }
.btn-outline{ background:transparent; border-color:var(--border); color:var(--ink); }
.btn-outline:hover{ border-color:var(--primary); color:var(--primary-dark); }
.btn-whatsapp{ background:#25d366; color:#06210f; }
.btn-whatsapp:hover{ background:#1ebd59; }
.btn-block{ width:100%; border-radius:var(--radius-m); white-space:normal; text-align:center; }
.btn-sm{ padding:8px 13px; font-size:.78rem; }
.btn[disabled]{ opacity:.5; pointer-events:none; }
.btn-danger{ background:transparent; color:var(--danger); border-color:var(--danger); }

/* ---------- Category chips ---------- */
.section-title{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:26px 0 12px; }
.section-title h2{ font-size:1.2rem; font-weight:600; }
.section-title .count{ font-size:.8rem; color:var(--text-soft); font-weight:600; }

.category-rail{ display:flex; gap:16px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none; }
.category-rail::-webkit-scrollbar{ display:none; }
.category-card{
  flex:none; width:132px; border-radius:var(--radius-m); border:1px solid var(--border);
  background:var(--surface); padding:14px 12px; text-align:left; display:flex; flex-direction:column; gap:10px;
}
.category-card.active{ border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft) inset; }
.category-icon{ width:34px; height:34px; border-radius:10px; background:var(--primary-soft); color:var(--primary-dark); display:flex; align-items:center; justify-content:center; }
.category-icon svg, .brand-mark svg{ width:60%; height:60%; flex:none; }
.category-card b{ font-size:.84rem; line-height:1.25; }
.category-card span{ font-size:.72rem; color:var(--text-soft); }

/* ---------- Search & filter bar ---------- */
.toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:14px 0; }
.search-box{
  flex:1 1 220px; display:flex; align-items:center; gap:8px;
  border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:10px 14px;
}
.search-box svg{ width:17px; height:17px; color:var(--text-soft); flex:none; }
.search-box input{ border:none; outline:none; background:none; color:var(--text); width:100%; font-size:.9rem; }
.chip-select{ border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:999px; padding:9px 14px; font-size:.85rem; font-weight:600; }

/* ---------- Product grid ---------- */
.product-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px; margin:6px 0 34px; }
@media (max-width: 480px){
  .product-grid{ grid-template-columns:1fr 1fr; gap:10px; }
  .product-actions{ flex-direction:column; }
  .product-actions .btn{ flex:none; }
}
@media (max-width: 360px){
  .product-grid{ grid-template-columns:1fr; }
}
.product-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
  display:flex; flex-direction:column; overflow:hidden; box-shadow:var(--shadow);
}
.product-media{ aspect-ratio:1/1; background:var(--surface-2); position:relative; }
.product-media img{ width:100%; height:100%; object-fit:cover; }
.product-media .ph{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--primary); background:var(--primary-soft); }
.product-media .ph svg{ width:38%; height:38%; }
.product-badge{ position:absolute; top:8px; left:8px; background:var(--ink); color:var(--bg); font-size:.62rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:4px 8px; border-radius:999px; }
.product-body{ padding:12px 12px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
.product-cat{ font-size:.68rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--primary-dark); }
.product-name{ font-weight:700; font-size:.94rem; line-height:1.3; }
.product-desc{ font-size:.79rem; color:var(--text-soft); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.product-price{ font-family:var(--font-display); font-weight:600; font-size:1.15rem; margin-top:2px; font-variant-numeric:tabular-nums; }
.product-variant{ margin-top:2px; }
.product-variant select{ width:100%; padding:7px 9px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.8rem; }
.product-actions{ display:flex; gap:8px; margin-top:8px; }
.product-actions .btn{ flex:1; padding:9px 8px; font-size:.76rem; }
.qty-row{ display:flex; align-items:center; gap:8px; }
.qty-row button{ width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-weight:700; }
.qty-row .qv{ min-width:20px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; }

.empty-note{ padding:30px 16px; text-align:center; color:var(--text-soft); border:1px dashed var(--border); border-radius:var(--radius-m); }

/* ---------- Floating WhatsApp ---------- */
.wa-float{
  position:fixed; right:calc(18px + env(safe-area-inset-right,0px)); bottom:calc(18px + env(safe-area-inset-bottom,0px));
  z-index:50; width:56px; height:56px; border-radius:50%; background:#25d366; color:#06210f;
  display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px -8px rgba(6,33,15,.5);
  border:none;
}
.wa-float svg{ width:28px; height:28px; }

/* ---------- Cart drawer ---------- */
.overlay{ position:fixed; inset:0; background:rgba(10,16,12,.45); z-index:60; }
.drawer{
  position:fixed; top:0; right:0; height:100%; width:min(400px, 100%); background:var(--surface);
  z-index:61; display:flex; flex-direction:column; box-shadow:-14px 0 30px -18px rgba(0,0,0,.4);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer-head{ display:flex; align-items:center; gap:10px; padding:16px 16px 12px; border-bottom:1px solid var(--border); }
.drawer-head h2{ font-size:1.05rem; margin-right:auto; }
.drawer-body{ flex:1; overflow-y:auto; padding:12px 16px; }
.cart-line{ display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); }
.cart-line img, .cart-line .ph{ width:56px; height:56px; border-radius:10px; object-fit:cover; background:var(--surface-2); flex:none; }
.cart-line .ph{ display:flex; align-items:center; justify-content:center; color:var(--primary); }
.cart-line .ph svg{ width:22px; height:22px; }
.cart-line-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.cart-line-info b{ font-size:.86rem; }
.cart-line-info .cart-variant{ font-size:.72rem; color:var(--text-soft); }
.cart-line-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
.link-remove{ background:none; border:none; color:var(--danger); font-size:.74rem; font-weight:700; padding:0; }
.drawer-foot{ border-top:1px solid var(--border); padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
.total-row{ display:flex; justify-content:space-between; font-weight:700; font-size:1.02rem; }
.total-note{ font-size:.72rem; color:var(--text-soft); margin:0; }

/* ---------- Admin ---------- */
.admin-fab{
  position:fixed; left:calc(14px + env(safe-area-inset-left,0px)); bottom:calc(14px + env(safe-area-inset-bottom,0px));
  z-index:45; font-size:.68rem; color:var(--text-soft); background:var(--surface); border:1px solid var(--border);
  border-radius:999px; padding:6px 12px; opacity:.55;
}
.admin-fab:hover{ opacity:1; }
.admin-modal{ position:fixed; inset:0; z-index:80; background:var(--bg); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
.admin-head{ display:flex; align-items:center; gap:10px; padding:16px; border-bottom:1px solid var(--border); }

.admin-tabs{ display:flex; gap:8px; padding:0 16px; border-bottom:1px solid var(--border); overflow-x:auto; }
.admin-tab{ background:none; border:none; padding:10px 4px; font-weight:700; font-size:.82rem; color:var(--text-soft); border-bottom:2px solid transparent; white-space:nowrap; }
.admin-tab.active{ color:var(--primary-dark); border-color:var(--primary); }

.field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.field label{ font-size:.76rem; font-weight:700; color:var(--text-soft); }
.field input, .field select, .field textarea{

}
.field textarea{ resize:vertical; min-height:70px; }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.help-text{ font-size:.72rem; color:var(--text-soft); }

.admin-list{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
.admin-row{ display:flex; gap:10px; align-items:center; border:1px solid var(--border); border-radius:12px; padding:10px; background:var(--surface); }
.admin-row img, .admin-row .ph{ width:46px; height:46px; border-radius:8px; object-fit:cover; background:var(--surface-2); flex:none; }
.admin-row .ph{ display:flex; align-items:center; justify-content:center; color:var(--primary); }
.admin-row .ph svg{ width:20px; height:20px; }
.admin-row-info{ flex:1; min-width:0; }
.admin-row-info b{ display:block; font-size:.86rem; }
.admin-row-info span{ font-size:.72rem; color:var(--text-soft); }
.admin-row-actions{ display:flex; gap:6px; flex:none; }
.admin-row-actions button{ width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--bg); }

.card-panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px; margin-bottom:16px; }
.card-panel h3{ font-size:.92rem; margin-bottom:12px; }

.image-drop{
  border:1.5px dashed var(--border); border-radius:12px; padding:16px; text-align:center; cursor:pointer; background:var(--surface);
}
.image-drop img{ max-height:120px; margin:0 auto 8px; border-radius:8px; }
.image-drop span{ font-size:.78rem; color:var(--text-soft); }

.gate{ position:fixed; inset:0; z-index:90; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; }
.gate-card{ max-width:320px; width:100%; text-align:center; }
.gate-card h2{ font-size:1.1rem; margin-bottom:6px; }
.gate-card p{ color:var(--text-soft); font-size:.85rem; margin-bottom:14px; }

.toast{
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:.82rem; font-weight:600;
  z-index:100; box-shadow:var(--shadow); max-width:90vw; text-align:center;
}

.site-footer{ border-top:1px solid var(--border); margin-top:30px; padding:24px 0 40px; color:var(--text-soft); font-size:.82rem; }
.site-footer .foot-row{ display:flex; flex-wrap:wrap; gap:10px 20px; justify-content:space-between; align-items:center; }
.foot-links{ display:flex; gap:14px; flex-wrap:wrap; }
.foot-links a, .admin-open-link{ background:none; border:none; color:var(--text-soft); font-size:.78rem; text-decoration:underline; padding:0; }

@media (min-width: 720px){
  .hero{ padding:44px 40px; }
  .product-grid{ grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:18px; }
}

/* ---------------- cart (persisté en localStorage, propre à ce visiteur) ---------------- */
var CART_KEY = 'pdbe_cart_v1';
var cart = loadCart(); // [{key, productId, variant, qty}]
function loadCart(){
  try{
    var raw = localStorage.getItem(CART_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveCart(){
  try{ localStorage.setItem(CART_KEY, JSON.stringify(cart)); }catch(e){ /* stockage indisponible: panier en mémoire seulement */ }
}
function cartCount(){ return cart.reduce(function(s,l){ return s + l.qty; }, 0); }
function findProduct(id){ return byId(STATE.products, id); }
function cartLineTotal(line){
  var p = findProduct(line.productId);
  if (!p) return 0;
  return p.price * line.qty;
}
function cartTotal(){ return cart.reduce(function(s,l){ return s + cartLineTotal(l); }, 0); }

function addToCart(productId, variant){
  var key = productId + '::' + (variant||'');
  var line = null;
  for (var i=0;i<cart.length;i++){ if (cart[i].key===key){ line = cart[i]; break; } }
  if (line){ line.qty += 1; }
  else { cart.push({ key:key, productId:productId, variant:variant||'', qty:1 }); }
  saveCart();
  updateCartUI();
  toast('Ajouté au panier');
}
function setQty(key, delta){
  for (var i=0;i<cart.length;i++){
    if (cart[i].key===key){
      cart[i].qty += delta;
      if (cart[i].qty <= 0) cart.splice(i,1);
      break;
    }
  }
  saveCart();
  updateCartUI();
}
function removeLine(key){
  cart = cart.filter(function(l){ return l.key!==key; });
  saveCart();
  updateCartUI();
}

/* ---------------- WhatsApp ---------------- */
function waNumber(){ return digitsOnly(STATE.shop.whatsapp); }
function waLink(message){ return 'https://wa.me/' + waNumber() + '?text=' + encodeURIComponent(message); }
function buildCartMessage(){
  var lines = cart.map(function(l){
    var p = findProduct(l.productId);
    if (!p) return null;
    var v = l.variant ? ' (' + l.variant + ')' : '';
    return '- ' + p.name + v + ' x' + l.qty + ' : ' + fmtFcfa(p.price * l.qty);
  }).filter(Boolean);
  var msg = 'Bonjour, je souhaite passer cette commande :\n' + lines.join('\n') +
    '\nTotal produits : ' + fmtFcfa(cartTotal()) +
    '\n\nLes frais de livraison seront ajoutés une fois la commande envoyée sur WhatsApp.';
  return msg;
}
function buildSingleMessage(product, variant){
  var v = variant ? ' (' + variant + ')' : '';
  return 'Bonjour, je souhaite commander :\n- ' + product.name + v + ' x1 : ' + fmtFcfa(product.price) +
    '\n\nLes frais de livraison seront ajoutés une fois la commande envoyée sur WhatsApp.';
}

/* ---------------- toast ---------------- */
var toastTimer = null;
function toast(msg){
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.hidden = true; }, 2400);
}

function defaultVariantString(p){
  return (p.variants||[]).map(function(v){ return v.label + ': ' + (v.options && v.options[0] || ''); }).join(', ');
}
function productCardHtml(p){
  var cat = byId(STATE.categories, p.categoryId);
  var media = p.image
    ? '<img src="' + p.image + '" alt="' + esc(p.name) + '" loading="lazy">'
    : '<div class="ph">' + leafSvg() + '</div>';
  var variantsHtml = (p.variants||[]).map(function(v, vi){
    return '<div class="product-variant"><select data-role="variant" data-vlabel="' + esc(v.label) + '" data-vindex="' + vi + '" data-pid="' + p.id + '">' +
      v.options.map(function(o){ return '<option value="' + esc(o) + '">' + esc(v.label) + ' : ' + esc(o) + '</option>'; }).join('') +
      '</select></div>';
  }).join('');
  var orderHref = waLink(buildSingleMessage(p, defaultVariantString(p)));
  return '<article class="product-card" data-product="' + p.id + '">' +
    '<div class="product-media">' + media + (p.badge ? '<span class="product-badge">' + esc(p.badge) + '</span>' : '') + '</div>' +
    '<div class="product-body">' +
      '<span class="product-cat">' + (cat ? esc(cat.name) : '') + '</span>' +
      '<h3 class="product-name">' + esc(p.name) + '</h3>' +
      '<p class="product-desc">' + esc(p.desc) + '</p>' +
      variantsHtml +
      '<span class="product-price">' + fmtFcfa(p.price) + '</span>' +
      '<div class="product-actions">' +
        '<button class="btn btn-outline" data-action="add-cart" data-id="' + p.id + '">Ajouter au panier</button>' +
        '<a class="btn btn-whatsapp" id="order-one-' + p.id + '" target="_blank" rel="noopener" href="' + orderHref + '">' + iconSvg('whatsapp') + ' Commander</a>' +
      '</div>' +
    '</div></article>';
}
function filteredProducts(){
  var q = norm(ui.query);
  return STATE.products.filter(function(p){
    if (ui.category!=='all' && p.categoryId!==ui.category) return false;
    if (q && norm(p.name).indexOf(q)===-1 && norm(p.desc).indexOf(q)===-1) return false;
    return true;
  });
}
function renderProducts(){
  var grid = document.getElementById('product-grid');
  if (!grid) return;
  var list = filteredProducts();
  document.getElementById('grid-count').textContent = list.length + (list.length>1?' articles':' article');
  document.getElementById('grid-title').textContent = ui.category==='all' ? 'Tous nos produits' : (byId(STATE.categories, ui.category)||{}).name || 'Produits';
  grid.innerHTML = list.length ? list.map(productCardHtml).join('') :
    '<div class="empty-note" style="grid-column:1/-1">Aucun produit ne correspond à votre recherche pour le moment.</div>';
}

/* ================= RENDER: panier ================= */
function updateCartUI(){
  var n = cartCount();
  var badge = document.getElementById('cart-count');
  if (badge){ badge.textContent = n; badge.hidden = n===0; }
  if (ui.cartOpen) renderCartDrawer();
}
function renderCartDrawer(){
  var root2 = document.getElementById('cart-root');
  if (!ui.cartOpen){ root2.innerHTML=''; return; }
  var body = cart.length ? cart.map(function(l){
    var p = findProduct(l.productId);
    if (!p) return '';
    var media = p.image ? '<img src="' + p.image + '" alt="">' : '<div class="ph">' + leafSvg() + '</div>';
    return '<div class="cart-line">' + media +
      '<div class="cart-line-info">' +
        '<b>' + esc(p.name) + '</b>' +
        (l.variant ? '<span class="cart-variant">' + esc(l.variant) + '</span>' : '') +
        '<div class="cart-line-foot">' +
          '<div class="qty-row">' +
            '<button data-action="qty-dec" data-key="' + esc(l.key) + '" aria-label="Réduire la quantité">' + iconSvg('minus') + '</button>' +
            '<span class="qv">' + l.qty + '</span>' +
            '<button data-action="qty-inc" data-key="' + esc(l.key) + '" aria-label="Augmenter la quantité">' + iconSvg('plus') + '</button>' +
          '</div>' +
          '<b>' + fmtFcfa(cartLineTotal(l)) + '</b>' +
        '</div>' +
        '<button class="link-remove" data-action="remove-line" data-key="' + esc(l.key) + '">Supprimer</button>' +
      '</div></div>';
  }).join('') : '<div class="empty-note">Votre panier est vide pour le moment.</div>';

  root2.innerHTML = '<div class="overlay" data-action="close-cart"></div>' +
    '<aside class="drawer" role="dialog" aria-label="Panier">' +
      '<div class="drawer-head"><h2>Votre panier</h2><button class="icon-btn" data-action="close-cart" aria-label="Fermer">' + iconSvg('close') + '</button></div>' +
      '<div class="drawer-body">' + body + '</div>' +

        '<p class="total-note">Les frais de livraison seront ajoutés une fois la commande envoyée sur WhatsApp.</p>' +
        '<a class="btn btn-whatsapp btn-block" id="send-order" ' + (cart.length? ('target="_blank" rel="noopener" href="' + waLink(buildCartMessage()) + '"') : 'aria-disabled="true"') + '>' + iconSvg('whatsapp') + ' Envoyer ma commande sur WhatsApp</a>' +

      (editing ? '<button class="btn btn-outline" data-action="cancel-edit-category">Annuler</button>' : '') +
    '</div></div>' +
    '<h3 style="margin:18px 0 6px">Catégories (' + STATE.categories.length + ')</h3>' +
    '<div class="admin-list">' + list + '</div>';
}

  var logoPreview = s.logo

  '</div>' +
  '<div class="card-panel"><h3>Informations de la boutique</h3>' +

    '<div class="field"><label>Message d\'accroche (bandeau)</label><input id="sf-eyebrow" value="' + esc(s.tagline) + '"></div>' +
    '<div class="field"><label>Titre d\'accueil</label><input id="sf-herotitle" value="' + esc(s.heroTitle) + '"></div>' +
    '<div class="field"><label>Texte d\'accueil</label><textarea id="sf-herotext">' + esc(s.heroText) + '</textarea></div>' +
    '<div class="field"><label>Numéro WhatsApp (avec indicatif, sans espaces)</label><input id="sf-whatsapp" value="' + esc(s.whatsapp) + '"></div>' +
    '<button class="btn btn-primary" data-action="save-settings">Enregistrer les informations</button>' +
  '</div>' +
  '<div class="card-panel"><h3>Code d\'accès à la gestion</h3>' +
    '<p class="help-text">Ce code masque l\'accès à cet espace pour vos clients. Gardez-le secret et changez-le si besoin.</p>' +
    '<div class="field"><label>Nouveau code d\'accès</label><input id="sf-passcode" value="' + esc(s.passcode) + '"></div>' +
    '<button class="btn btn-primary" data-action="save-passcode">Mettre à jour le code</button>' +
  '</div>' +
  (isClaudeHost()
    ? '<div class="card-panel"><h3>Publier les modifications</h3>' +
        '<p class="help-text">Les changements ci-dessus sont enregistrés dans cette page. Cliquez pour les publier afin que tous vos clients les voient.</p>' +
        '<button class="btn btn-primary btn-block" data-action="publish-site">Publier les modifications</button>' +
        '<p class="help-text" id="publish-status" style="margin-top:8px"></p>' +
      '</div>'
    : '<div class="card-panel"><h3>Mettre le site à jour</h3>' +
        '<p class="help-text">Ce site est hébergé en dehors de Claude. Cliquez pour télécharger le fichier à jour, puis remplacez <code>index.html</code> sur votre hébergeur (GitHub, etc.) pour que vos clients voient les changements.</p>' +
        '<button class="btn btn-primary btn-block" data-action="publish-site">Télécharger le site mis à jour</button>' +
        '<p class="help-text" id="publish-status" style="margin-top:8px"></p>' +
      '</div>');
}

/* ---------------- image compression ---------------- */
function compressImageFile(file, maxDim, quality, format){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxDim / Math.max(w,h));
      var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, cw, ch);
      URL.revokeObjectURL(url);
      try{ resolve(canvas.toDataURL(format || 'image/jpeg', quality||0.72)); }
      catch(e){ reject(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('image invalide')); };
    img.src = url;
  });
}

/* ---------------- publier / mettre à jour ---------------- */
/* Ce même fichier fonctionne dans deux contextes : publié via l'outil
   Artifact de Claude (window.claude existe, on republie en place), ou
   hébergé ailleurs — GitHub Pages, etc. (window.claude n'existe pas, on
   propose un téléchargement du fichier à jour à ré-uploader soi-même). */
function isClaudeHost(){
  return typeof window.claude !== 'undefined' && !!(window.claude && window.claude.use);
}
function buildFullHtml(state){
  var stateJson = scriptSafe(JSON.stringify(state));
  var appSrc = scriptSafe(document.getElementById('app-script').textContent);
  var styleTxt = document.getElementById('app-style').textContent;
  var favicon = state.shop.logo ? '<link rel="icon" href="' + state.shop.logo + '">\n' : '';
  return '<!doctype html>\n<html lang="fr">\n<head>\n' +
    '<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
    '<title>' + esc(state.shop.name) + ' — Catalogue &amp; Commande</title>\n' +
    favicon +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700;800&display=swap">\n' +
    '<style id="app-style">' + styleTxt + '</style>\n' +
    '</head>\n<body>\n' +
    '<div id="app-root"></div>\n' +
    '<script id="site-state" type="application/json">' + stateJson + '<\/script>\n' +
    '<script id="app-script">' + appSrc + '<\/script>\n' +
    '</body>\n</html>';
}

function setPublishStatus(msg){
  var el = document.getElementById('publish-status');
  if (el) el.textContent = msg;
}
function downloadUpdatedSite(){
  var html = buildFullHtml(STATE);
  var blob = new Blob([html], { type:'text/html' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'index.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  setPublishStatus('Fichier téléchargé — remplacez index.html sur votre hébergeur pour publier.');
  toast('Site téléchargé');
}
function publishSite(){
  if (!isClaudeHost()){ downloadUpdatedSite(); return; }
  setPublishStatus('Publication en cours…');
  claude.use('artifact').then(function(artifact){
    if (!artifact){
      downloadUpdatedSite();
      return;
    }
    var html = buildFullHtml(STATE);
    artifact.publish(html).then(function(){
      setPublishStatus('Publié ! Tous vos clients verront la nouvelle version.');
      toast('Modifications publiées');
    }).catch(function(err){
      var code = err && err.code;
      if (code==='not_writer' || code==='not_granted'){
        setPublishStatus('Seule la propriétaire de la boutique peut publier depuis sa propre session.');
      } else if (code==='conflict'){
        setPublishStatus('Une version plus récente existe déjà — la page va se recharger.');
      } else {
        setPublishStatus('La publication a échoué (' + (code||'erreur') + '). Réessayez dans un instant.');
      }
    });
  });
}

/* ================= actions ================= */
function scrollToId(id){
  var el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
}
function setActiveNav(name){
  var links = root.querySelectorAll('.nav-link');
  links.forEach(function(l){ l.classList.toggle('active', l.getAttribute('data-nav')===name); });
}

function handleClick(e){
  var t = e.target;
  var actionEl = t.closest('[data-action]');
  var navEl = t.closest('[data-nav]');
  var catEl = t.closest('[data-cat]');
  var admintabEl = t.closest('[data-admintab]');

  if (navEl){
    var nav = navEl.getAttribute('data-nav');
    setActiveNav(nav);
    if (nav==='accueil') scrollToId('accueil');
    else if (nav==='categories') scrollToId('category-rail');
    else if (nav==='produits') scrollToId('produits');
    else if (nav==='contact') scrollToId('contact');
    else if (nav==='panier'){ ui.cartOpen = true; renderCartDrawer(); }
    return;
  }
  if (catEl){
    ui.category = catEl.getAttribute('data-cat');
    renderCategoryRail(); renderProducts();
    return;
  }
  if (admintabEl){
    ui.adminTab = admintabEl.getAttribute('data-admintab');
    ui.editingProductId = null; ui.editingCategoryId = null; productDraft = emptyProductDraft();
    renderAdmin();
    return;
  }
  if (!actionEl){
    if (t.closest('#cart-btn')){ ui.cartOpen = true; renderCartDrawer(); }
    else if (t.closest('#admin-open')){ ui.adminOpen = true; renderAdmin(); }
    return;
  }
  var action = actionEl.getAttribute('data-action');
  var id = actionEl.getAttribute('data-id');

  if (action==='close-cart'){ ui.cartOpen = false; renderCartDrawer(); }
  else if (action==='close-admin'){ closeAdmin(); }
  else if (action==='add-cart'){
    var card = actionEl.closest('.product-card');
    var variant = readVariantFromCard(card);
    addToCart(id, variant);
  }
  else if (action==='qty-inc'){ setQty(actionEl.getAttribute('data-key'), 1); }
  else if (action==='qty-dec'){ setQty(actionEl.getAttribute('data-key'), -1); }
  else if (action==='remove-line'){ removeLine(actionEl.getAttribute('data-key')); }
  else if (action==='edit-product'){ startEditProduct(id); }
  else if (action==='delete-product'){ deleteProduct(id); }
  else if (action==='cancel-edit-product'){ ui.editingProductId=null; productDraft = emptyProductDraft(); renderAdminBody(); }
  else if (action==='save-product'){ saveProductDraft(); }
  else if (action==='add-variant'){ readProductFormIntoDraft(); productDraft.variants.push({label:'', options:[]}); renderAdminBody(); }
  else if (action==='remove-variant'){ readProductFormIntoDraft(); productDraft.variants.splice(Number(actionEl.getAttribute('data-index')),1); renderAdminBody(); }
  else if (action==='edit-category'){ ui.editingCategoryId = id; renderAdminBody(); }
  else if (action==='delete-category'){ deleteCategory(id); }
  else if (action==='cancel-edit-category'){ ui.editingCategoryId=null; renderAdminBody(); }
  else if (action==='save-category'){ saveCategoryDraft(); }
  else if (action==='save-settings'){ saveSettings(); }
  else if (action==='save-passcode'){ savePasscode(); }
  else if (action==='remove-logo'){ STATE.shop.logo = ''; renderShell(); ui.adminOpen = true; ui.adminUnlocked = true; ui.adminTab = 'reglages'; renderAdmin(); toast('Logo retiré (pensez à publier)'); }
  else if (action==='publish-site'){ publishSite(); }
}

function readVariantFromCard(card){
  if (!card) return '';
  var selects = card.querySelectorAll('[data-role="variant"]');
  var parts = [];
  selects.forEach(function(s){ parts.push(s.getAttribute('data-vlabel') + ': ' + s.value); });
  return parts.join(', ');
}

function startEditProduct(id){
  var p = findProduct(id);
  if (!p) return;
  ui.editingProductId = id;
  productDraft = { id:p.id, name:p.name, categoryId:p.categoryId, price:p.price, desc:p.desc, variants: JSON.parse(JSON.stringify(p.variants||[])), image:p.image||'' };
  renderAdminBody();
  scrollToAdminTop();
}
function scrollToAdminTop(){
  var b = document.getElementById('admin-body');
  if (b) b.scrollTop = 0;
}
function deleteProduct(id){
  if (!window.confirm('Supprimer ce produit ?')) return;
  STATE.products = STATE.products.filter(function(p){ return p.id!==id; });
  renderAdminBody(); renderCategoryRail(); renderProducts();
  toast('Produit supprimé (pensez à publier)');
}
function saveProductDraft(){
  readProductFormIntoDraft();
  if (!productDraft.name.trim()){ toast('Le nom du produit est requis'); return; }
  var priceNum = Number(String(productDraft.price).replace(/[^0-9]/g,''));
  if (!priceNum){ toast('Le prix doit être un nombre'); return; }
  var clean = {
    id: productDraft.id || uid('p'),
    name: productDraft.name.trim(),
    categoryId: productDraft.categoryId,
    price: priceNum,
    desc: productDraft.desc.trim(),
    variants: productDraft.variants.filter(function(v){ return v.label && v.options && v.options.length; }),
    image: productDraft.image || ''
  };
  if (productDraft.id){
    STATE.products = STATE.products.map(function(p){ return p.id===clean.id ? clean : p; });
  } else {
    STATE.products.push(clean);
  }
  ui.editingProductId = null;
  productDraft = emptyProductDraft();
  renderAdminBody(); renderCategoryRail(); renderProducts();
  toast('Produit enregistré (pensez à publier)');
}
function readProductFormIntoDraft(){
  var name = document.getElementById('pf-name'); if (name) productDraft.name = name.value;
  var cat = document.getElementById('pf-category'); if (cat) productDraft.categoryId = cat.value;
  var price = document.getElementById('pf-price'); if (price) productDraft.price = price.value;
  var desc = document.getElementById('pf-desc'); if (desc) productDraft.desc = desc.value;
  var rows = document.querySelectorAll('[data-variant-row]');
  rows.forEach(function(row){
    var idx = Number(row.getAttribute('data-variant-row'));
    var labelInp = row.querySelector('[data-vfield="label"]');
    var optsInp = row.querySelector('[data-vfield="options"]');
    if (productDraft.variants[idx]){
      productDraft.variants[idx].label = labelInp ? labelInp.value : '';
      productDraft.variants[idx].options = optsInp ? optsInp.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean) : [];
    }
  });
}

function saveCategoryDraft(){
  var inp = document.getElementById('cf-name');
  var val = inp ? inp.value.trim() : '';
  if (!val){ toast('Le nom de la catégorie est requis'); return; }
  if (ui.editingCategoryId){
    STATE.categories = STATE.categories.map(function(c){ return c.id===ui.editingCategoryId ? { id:c.id, name:val } : c; });
    ui.editingCategoryId = null;
  } else {
    STATE.categories.push({ id: uid('c'), name: val });
  }
  renderAdminBody(); renderCategoryRail(); renderProducts();
  toast('Catégorie enregistrée (pensez à publier)');
}
function deleteCategory(id){
  var count = categoryProductCount(id);
  if (count > 0){
    window.alert('Impossible de supprimer : ' + count + ' produit(s) utilisent encore cette catégorie.');
    return;
  }
  if (!window.confirm('Supprimer cette catégorie ?')) return;
  STATE.categories = STATE.categories.filter(function(c){ return c.id!==id; });
  renderAdminBody(); renderCategoryRail(); renderProducts();
  toast('Catégorie supprimée (pensez à publier)');
}

function saveSettings(){
  function v(id){ var el = document.getElementById(id); return el ? el.value : ''; }
  STATE.shop.name = v('sf-name').trim() || STATE.shop.name;
  STATE.shop.tagline = v('sf-eyebrow').trim();
  STATE.shop.heroTitle = v('sf-herotitle').trim();
  STATE.shop.heroText = v('sf-herotext').trim();
  STATE.shop.whatsapp = v('sf-whatsapp').trim();
  renderShell();
  ui.adminOpen = true; ui.adminUnlocked = true; ui.adminTab = 'reglages';
  renderAdmin();
  toast('Informations enregistrées (pensez à publier)');
}
function savePasscode(){
  var el = document.getElementById('sf-passcode');
  var val = el ? el.value.trim() : '';
  if (!val){ toast('Le code ne peut pas être vide'); return; }
  STATE.shop.passcode = val;
  toast('Code mis à jour (pensez à publier)');
}

function handleSubmit(e){
  if (e.target && e.target.id==='gate-form'){
    e.preventDefault();
    var val = document.getElementById('gate-input').value;
    if (val === STATE.shop.passcode){
      ui.adminUnlocked = true;
      renderAdmin();
    } else {
      toast('Code incorrect');
    }
  }
}

function handleInput(e){
  if (e.target && e.target.id==='search-input'){
    ui.query = e.target.value;
    renderProducts();
  }
}
function handleChange(e){
  if (e.target && e.target.matches && e.target.matches('[data-role="variant"]')){
    var pid = e.target.getAttribute('data-pid');
    var p = findProduct(pid);
    var card = e.target.closest('.product-card');
    var link = document.getElementById('order-one-' + pid);
    if (p && card && link){ link.href = waLink(buildSingleMessage(p, readVariantFromCard(card))); }
  } else if (e.target && e.target.id==='category-select'){
    ui.category = e.target.value;
    renderCategoryRail(); renderProducts();
  } else if (e.target && e.target.id==='product-image-input'){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    compressImageFile(file, 800, 0.72).then(function(dataUrl){
      readProductFormIntoDraft();
      productDraft.image = dataUrl;
      renderAdminBody();
    }).catch(function(){ toast('Image invalide'); });
  } else if (e.target && e.target.id==='shop-logo-input'){
    var lfile = e.target.files && e.target.files[0];
    if (!lfile) return;
    compressImageFile(lfile, 480, 1, 'image/png').then(function(dataUrl){
      STATE.shop.logo = dataUrl;
      renderShell();
      ui.adminOpen = true; ui.adminUnlocked = true; ui.adminTab = 'reglages';
      renderAdmin();
      toast('Logo mis à jour (pensez à publier)');
    }).catch(function(){ toast('Image invalide'); });
  }
}

var bound = false;
function bindOnce(){
  if (bound) return;
  bound = true;
  document.body.addEventListener('click', handleClick);
  document.body.addEventListener('submit', handleSubmit);
  document.body.addEventListener('input', handleInput);
  document.body.addEventListener('change', handleChange);
}

/* ================= boot ================= */
renderShell();

/* hook exposed for diagnostics only (no sensitive data beyond what the
   storefront already shows) */
window.__pdbeDebug = { buildFullHtml: buildFullHtml, getState: function(){ return STATE; } };

})();
</script>
